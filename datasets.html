<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datasets · APIQurate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="img/mark.png" type="image/png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell" id="shell">

  <aside class="rail">
    <div class="rail__head">
      <a class="mark" href="index.html">
        <img class="mark__full" src="img/logo.png" alt="APIQurate">
        <img class="mark__icon" src="img/mark.png" alt="APIQurate">
      </a>
      <button class="rail__toggle" id="railToggle" aria-label="Collapse navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
      </button>
    </div>
    <div class="rail__body"><nav id="nav"></nav></div>
    <div class="rail__foot" id="whoami"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumbs"><span>Data Engineering</span><i>/</i><span aria-current="page">Datasets</span></div>
      <div class="topbar__tools">
        <button class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>
    </header>

    <main class="canvas">

      <div class="pagehead">
        <div>
          <h1>Datasets</h1>
          <p>Tables materialised in the warehouse after each load.</p>
        </div>
      </div>

      <div class="card">
        <div class="card__body card__body--flush">
          <div class="empty">
            <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/></svg>
            <h3>No datasets yet</h3>
            <p>Datasets appear after the first successful pipeline run loads data into the warehouse.</p>
            <a class="btn" href="sources.html">Add an API connection first</a>
          </div>
        </div>
      </div>

    </main>
  </div>

</div>
<script src="js/app.js"></script>
</body>
</html>
