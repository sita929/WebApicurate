<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · APIQurate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="img/mark.png" type="image/png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="auth">
  <div class="auth__card">
    <div class="auth__mark">
      <img class="auth__logo" src="img/logo.png" alt="APIQurate">
    </div>
    <p class="auth__sub">Sign in to your workspace</p>

    <div class="auth__error" id="loginError" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginUser">Username</label>
        <input class="input" id="loginUser" type="text" autocomplete="username" value="TestUserSuman" autofocus required>
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input class="input" id="loginPass" type="password" autocomplete="current-password" value="TestUserSuman" required>
      </div>
      <button class="btn btn--primary" type="submit">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        Sign in
      </button>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
