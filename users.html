<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User management · APIQurate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="img/mark.png" type="image/png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell" id="shell">

  <aside class="rail">
    <div class="rail__head">
      <a class="mark" href="index.html">
        <img class="mark__full" src="img/logo.png" alt="APIQurate">
        <img class="mark__icon" src="img/mark.png" alt="APIQurate">
      </a>
      <button class="rail__toggle" id="railToggle" aria-label="Collapse navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
      </button>
    </div>
    <div class="rail__body"><nav id="nav"></nav></div>
    <div class="rail__foot" id="whoami"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumbs"><span>Admin</span><i>/</i><span aria-current="page">User management</span></div>
      <div class="topbar__tools">
        <button class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>
    </header>

    <main class="canvas">

      <div class="pagehead">
        <div>
          <h1>User management</h1>
          <p>Website accounts only — usernames and passwords. Each user's API connections and data stay their own.</p>
        </div>
      </div>

      <div class="card">
        <div class="card__head">
          <div class="card__title">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Add a user
          </div>
        </div>
        <div class="card__body">
          <div class="auth__error" id="userError" role="alert"></div>
          <form id="userForm">
            <div class="filters__body" style="padding:0">
              <div class="field">
                <label for="newUser">Username</label>
                <input class="input" id="newUser" type="text" autocomplete="off" required>
              </div>
              <div class="field">
                <label for="newPass">Password</label>
                <input class="input" id="newPass" type="text" autocomplete="off" required>
              </div>
              <button class="btn btn--primary" type="submit">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add user
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="filters">
        <div class="filters__head">
          <svg viewBox="0 0 24 24"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>
          Filters
        </div>
        <div class="filters__body">
          <div class="field">
            <label for="filterText">Username</label>
            <input class="input" id="filterText" type="search" placeholder="Search users">
          </div>
          <button class="btn" data-reset>Reset</button>
        </div>
      </div>

      <div class="card">
        <div class="card__body card__body--flush">
          <div class="tablewrap">
            <table class="grid">
              <thead>
                <tr><th>Username</th><th>Password</th><th>Role</th><th style="width:120px">Actions</th></tr>
              </thead>
              <tbody id="usersRows"></tbody>
            </table>
          </div>
          <div class="tablefoot">
            <span id="usersCount"></span>
          </div>
        </div>
      </div>

    </main>
  </div>

</div>
<script src="js/app.js"></script>
</body>
</html>
